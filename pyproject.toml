[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-moodle"
version = "0.1.0"
description = "Client, CLI si server MCP pentru platforma Moodle BL@ASE (online.ase.ro)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.12,<2",
]

[project.scripts]
ase-moodle = "ase_moodle.cli:main"
ase-moodle-mcp = "ase_moodle.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ase_moodle = ["data/*.md"]
