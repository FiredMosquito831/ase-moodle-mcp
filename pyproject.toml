[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-moodle"
version = "0.2.4"
description = "Client, CLI si server MCP pentru platforma Moodle BL@ASE (online.ase.ro)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "FiredMosquito831"}]
keywords = ["moodle", "bl-ase", "ase", "online-ase", "mcp", "model-context-protocol", "claude-code", "codex", "opencode", "antigravity", "ai-agents", "cli", "student-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "keyring>=24",
  "mcp>=1.12,<2",
  "playwright>=1.45",
]

[project.urls]
Homepage = "https://ase-moodle-mcp.danubelabs.net/"
Repository = "https://github.com/FiredMosquito831/ase-moodle-mcp"
Documentation = "https://github.com/FiredMosquito831/ase-moodle-mcp/tree/main/docs"
Issues = "https://github.com/FiredMosquito831/ase-moodle-mcp/issues"

[project.scripts]
ase-moodle = "ase_moodle.cli:main"
ase-moodle-mcp = "ase_moodle.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ase_moodle = ["data/*.md"]
