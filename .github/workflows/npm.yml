name: npm

# Publica pe npm pachetul din npm/ la fiecare push pe main care modifica npm/.
# Foloseste trusted publishing (OIDC): fara token stocat in GitHub.
# Publica doar daca versiunea din npm/package.json nu exista inca pe npm:
# ca sa publici o versiune noua, cresti "version" in npm/package.json.
#
# Setare pe npmjs.com (o singura data): pachetul ase-moodle-mcp -> Settings ->
# Trusted publisher -> GitHub Actions -> owner FiredMosquito831, repo ase-moodle-mcp,
# workflow filename npm.yml, environment gol.

on:
  push:
    branches: [main]
    paths: ["npm/**", ".github/workflows/npm.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Npm nou (trusted publishing cere npm 11.5.1 sau mai nou)
        run: npm install -g npm@latest

      - name: Publica versiunea daca e noua
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION exista deja pe npm. Cresti versiunea in npm/package.json ca sa publici."
          else
            npm publish --provenance --access public
          fi
