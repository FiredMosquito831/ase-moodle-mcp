name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e . pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes src tests

      - name: Tests (offline, fake Moodle)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
