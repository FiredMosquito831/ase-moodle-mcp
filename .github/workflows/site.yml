name: Site check

on:
  pull_request:
    paths: ["docs/**", "site-revamp/**", "scripts/build_site.py", "requirements-site.txt"]
  push:
    branches: [main, revamp]
    paths: ["docs/**", "site-revamp/**", "scripts/build_site.py", "requirements-site.txt"]

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-site.txt
      - run: python scripts/build_site.py --check
